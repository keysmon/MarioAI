levels:
  train: ["1-1", "1-2", "1-3", "2-1", "3-1", "4-1"]
  holdout: ["1-4", "5-1"]
env:
  skip: 4
  frame_stack: 4
  shape: 84
train:
  n_envs: 8
  total_timesteps: 5000000
  device: auto          # auto -> cuda if available, else cpu
  seed: 42
  checkpoint_freq: 100000
  normalize_reward: true
ppo:
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  gamma: 0.9
  learning_rate: 0.00025
  clip_range: 0.1
  ent_coef: 0.01
  vf_coef: 0.5
record:
  n_rollouts: 5
  fps: 30
  max_steps: 3000
